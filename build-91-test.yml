name: Build 91 Test APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Test91-Android-Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Extract source project
        run: unzip -o Test91-Android-Source.zip -d .
      - name: Build debug APK
        run: gradle -p Test91 :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 91-Test-debug-APK
          path: Test91/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
